services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: idea_ladder
      POSTGRES_PASSWORD: idea_ladder
      POSTGRES_DB: idea_ladder
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idea_ladder -d idea_ladder"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  db-data:
